name: CI

# push 到 main 的测试与构建由 deploy.yml 覆盖，这里只跑 PR
on:
  pull_request:

# 同一 PR 连推多个 commit 时只保留最新一次运行，旧的直接取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # 防止构建 hang 住烧满默认 6 小时超时
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # 与发布流水线（安卓/桌面）保持同版本，测试环境 = 出货环境
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
