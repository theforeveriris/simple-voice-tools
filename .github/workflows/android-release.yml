name: Android build & release

# 每次推送到 main：构建 APK 并更新「latest」预发布（滚动替换，稳定下载入口）；
# 推送 v* 标签：创建正式 Release（如 v0.8.0）。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test & build web
        run: |
          npx vitest run
          npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      # runner 每次全新，debug keystore 若随机生成则每次签名都不同——
      # 覆盖安装会因签名冲突失败。固定用仓库内的 ci-debug.keystore（仅 debug 用途，
      # 正式发布签名走 secrets，见 documentation/GUIDE-CAPACITOR.md）
      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp android/ci-debug.keystore ~/.android/debug.keystore

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/SimpleVoiceTool-v${{ steps.ver.outputs.version }}-debug.apk"

      # 正式发布（打 v* 标签）时建议换成签名构建：
      # 生成 keystore 后 base64 存入 secrets.ANDROID_KEYSTORE，
      # 密码/别名存 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS，
      # 在 assembleDebug 旁加 assembleRelease + signingConfig。见 documentation/GUIDE-CAPACITOR.md
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*.apk
          overwrite_files: true
          body: |
            Android build of Simple Voice Tool v${{ steps.ver.outputs.version }}
            - commit: ${{ github.sha }}
            - debug-signed APK（直接安装；正式签名见 documentation/GUIDE-CAPACITOR.md）
