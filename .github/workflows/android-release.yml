name: Android build & release

# 每次推送到 main：构建 APK 并更新「latest」预发布（滚动替换，稳定下载入口）；
# 推送 v* 标签：创建正式 Release（如 v0.8.0）。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test & build web
        run: |
          npx vitest run
          npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      # runner 每次全新，debug keystore 若随机生成则每次签名都不同——
      # 覆盖安装会因签名冲突失败。固定用仓库内的 ci-debug.keystore（仅 debug 用途）。
      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp android/ci-debug.keystore ~/.android/debug.keystore

      # 正式签名：三个 secrets（ANDROID_KEYSTORE / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS）齐全时解码出 key.properties → assembleRelease；
      # 未配置时回退 debug 构建（key.properties 已在 android/.gitignore）
      - name: Prepare signing
        id: sign
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" \
              > android/key.properties
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "suffix=release" >> "$GITHUB_OUTPUT"
            echo "signed=release"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "suffix=debug" >> "$GITHUB_OUTPUT"
            echo "signed=debug"
          fi

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.sign.outputs.task }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp "android/app/build/outputs/apk/${{ steps.sign.outputs.suffix }}/app-${{ steps.sign.outputs.suffix }}.apk" \
             "dist/SimpleVoiceTool-v${{ steps.ver.outputs.version }}-${{ steps.sign.outputs.suffix }}.apk"

      # 「latest」滚动预发布只保留当前版本：清理本家族（*-release.apk）中版本
      # 不同的旧资产。desktop 工作流对 *-setup.exe 同理——两个工作流各管各的
      # 家族，同 push 并发触发时互不误删。正式 Release（v* 标签）不清理，全量留存。
      - name: Prune old assets in "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="SimpleVoiceTool-v${{ steps.ver.outputs.version }}-release.apk"
          # 注意：gh release view --json 的 assets[].id 是 GraphQL 节点 ID（RA_…），
          # 不能用于 REST DELETE——改用 REST 端点拿数字 id
          listing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
            --jq '.assets[] | .name + "\t" + (.id | tostring)' 2>&1) || true
          echo "$listing" | while IFS=$'\t' read -r name id; do
            case "$name" in *-release.apk) ;; *) continue ;; esac
            [ "$name" = "$current" ] && continue
            case "$id" in ''|*[!0-9]*) continue ;; esac
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              || echo "::warning::prune: delete failed for $name (id=$id)"
          done

      # 生成正式签名 keystore 后：base64 -w0 svt-release.jks 存入 secrets.ANDROID_KEYSTORE，
      # 密码/别名存 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS（见 documentation/GUIDE-CAPACITOR.md）；
      # 注意：debug→release 签名变更 = 应用身份变更，已装用户需卸载重装（先做 ZIP 备份）
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*.apk
          overwrite_files: true
          body: |
            Android build of Simple Voice Tool v${{ steps.ver.outputs.version }}（${{ steps.sign.outputs.signed }}-signed）
            - commit: ${{ github.sha }}
