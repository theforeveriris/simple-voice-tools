name: Desktop build & release

# Tauri Windows 桌面包：推送到 main 构建 NSIS 安装包并更新「latest」预发布
# （与安卓工作流共用同一个滚动 release）；推送 v* 标签创建正式 Release。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 与安卓工作流同理：main 连推时取消旧运行防 latest 被旧包回写；
# 标签发布单独成组、不取消
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'rolling' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    # Rust 全量编译最慢，留足余量，同时防 hang 住烧满默认 6 小时超时
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 供正式 Release 用 git log 生成变更说明（需拿到上一个 tag）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test & build web
        run: |
          npx vitest run
          npm run build

      # 版本号单源 = package.json（安卓侧构建时直接读取，这里同步进 tauri.conf.json）
      - name: Sync version from package.json
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          conf.version = pkg.version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          console.log('tauri version =', conf.version);
          EOF

      - name: Build Tauri app (NSIS installer)
        run: npx tauri build

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe \
             "dist/SimpleVoiceTool-v${{ steps.ver.outputs.version }}-setup.exe"

      # 正式 Release（v* 标签）用 git log 生成变更说明——直推 main 不走 PR，
      # GitHub 自带的 generate_release_notes 拿不到条目；main 滚动发布保持原 body
      - name: Build release body
        id: notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "body<<EOF"
              echo "Simple Voice Tool v${{ steps.ver.outputs.version }}"
              echo
              if [ -n "$prev" ]; then
                git log --no-merges --pretty=format:'- %s (%h)' "$prev..$GITHUB_REF_NAME"
                echo
                echo
                echo "Full changes: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
              else
                echo "- Initial tagged release"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF"
              echo "Simple Voice Tool v${{ steps.ver.outputs.version }}"
              echo "- commit: ${{ github.sha }}"
              echo "- Windows installer（NSIS，WebView2 运行时系统自带）"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # 与安卓工作流同理：「latest」只保留当前版本的安装包（各管各的家族，
      # 并发触发互不误删）；正式 Release（v* 标签）不清理
      - name: Prune old assets in "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="SimpleVoiceTool-v${{ steps.ver.outputs.version }}-setup.exe"
          # 注意：gh release view --json 的 assets[].id 是 GraphQL 节点 ID（RA_…），
          # 不能用于 REST DELETE——改用 REST 端点拿数字 id（与安卓工作流同理）
          listing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
            --jq '.assets[] | .name + "\t" + (.id | tostring)' 2>&1) || true
          echo "$listing" | while IFS=$'\t' read -r name id; do
            case "$name" in *-setup.exe) ;; *) continue ;; esac
            [ "$name" = "$current" ] && continue
            case "$id" in ''|*[!0-9]*) continue ;; esac
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              || echo "::warning::prune: delete failed for $name (id=$id)"
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*.exe
          overwrite_files: true
          body: ${{ steps.notes.outputs.body }}
